[project]
name = "argo-harness"
version = "0.1.0"
description = "Argo: a general-purpose, provider-agnostic agent harness with layered memory, dreaming, hybrid retrieval, and workflow automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "reportlab>=4.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "mcp>=2.0",
]

[project.optional-dependencies]
computer = ["playwright>=1.44"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
bench = ["pyarrow>=16"]

[project.scripts]
argo = "argo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
